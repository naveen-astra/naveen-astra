name: Update profile card

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "generate_profile.py"
      - "portrait.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python generate_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile card"
          git push
